<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Interview Session</title>
    <!-- Иконки Material -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="css/styles.css">

    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            max-height: 50vh;
            overflow-y: auto;
            padding: 1rem;
            background: var(--bg-soft);
            border-radius: var(--border-radius);
            border: 1px solid var(--primary-purple);
        }
        .msg { padding: 1rem; border-radius: var(--border-radius); max-width: 85%; }
        .msg-ai { background: var(--bg-lavender); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-user { background: var(--primary-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .mic-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2rem;
            flex-direction: column;
        }
        .mic-btn {
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            cursor: pointer;
            box-shadow: var(--shadow-hover);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-btn .material-symbols-rounded { font-size: 40px; }
        .mic-btn:active { transform: scale(0.9); }
        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            background: #ef4444; /* Red for recording */
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="material-symbols-rounded">terminal</span>
                    InterviewAI
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">🏠 Выход</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Собеседование</h1>
        <p id="profile-info" style="color: var(--text-soft); text-align: center; margin-bottom: 2rem;">Загрузка профиля...</p>
        
        <div class="chat-container" id="chat">
            <!-- Messages go here -->
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="mic-btn" title="Нажмите, чтобы говорить">
                <span class="material-symbols-rounded">mic</span>
            </button>
            <p id="mic-status" style="margin-top: 1rem; color: var(--text-soft);">Нажмите и говорите</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/interview.js"></script>
</body>
</html>
