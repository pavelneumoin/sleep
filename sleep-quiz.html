<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина о сне - СоноТрекер 🏆</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0">
    <link rel="stylesheet" href="css/v2.css?v=2.0">
    <style>
        .quiz-container {
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid var(--primary-yellow);
        }
        .quiz-question {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 2rem;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .quiz-btn {
            background: var(--bg-soft);
            border: 2px solid var(--bg-lavender);
            color: var(--text-dark);
            padding: 1.2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .quiz-btn:hover {
            background: white;
            border-color: var(--primary-purple);
            transform: translateX(5px);
            box-shadow: var(--shadow-soft);
        }
        .quiz-btn.correct {
            background: var(--primary-mint);
            color: white;
            border-color: var(--primary-mint);
        }
        .quiz-btn.wrong {
            background: #ff7675;
            color: white;
            border-color: #ff7675;
        }
        .quiz-result {
            margin-top: 2rem;
            font-size: 1.2rem;
            font-weight: 800;
            display: none;
        }
        .next-btn {
            margin-top: 1.5rem;
            display: none;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="images/mascot.png" alt="Облачко" class="logo-icon">
                    СоноТрекер
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">🏠 Главная</a></li>
                        <li><a href="sleep-phases.html">🌙 Фазы сна</a></li>
                        <li><a href="sleep-tips.html">💡 Советы</a></li>
                        <li><a href="sleep-statistics.html">📊 Статистика</a></li>
                        <li><a href="ai-helper.html">🤖 Облачко</a></li>
                        <li><a href="sleep-quiz.html">🏆 Викторина</a></li>
                    </ul>
                </nav>
                <div class="user-stats" id="user-stats-container">
                    <span class="stat-badge star-bg" title="Твои звёздочки">⭐ <span id="total-stars">0</span></span>
                    <span class="stat-badge streak-bg" title="Дней подряд">🔥 <span id="current-streak">0</span></span>
                </div>
            </div>
        </div>
    </header>


    <style>
      /* === V2 PROMO BANNER (compact) === */
      .v2-promo-wrap { max-width: 1200px; margin: 12px auto 0; padding: 0 20px; }
      .v2-promo-card {
        position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px;
        background: linear-gradient(120deg, #8b6fd4 0%, #6a4fb8 45%, #b277d4 100%);
        border-radius: 14px; padding: 8px 14px; color: #fff; text-decoration: none;
        box-shadow: 0 6px 16px rgba(106,79,184,.25);
        transition: transform .2s, box-shadow .2s;
        font-size: 13px;
      }
      .v2-promo-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(106,79,184,.35); }
      .v2-promo-card::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%);
        transform: translateX(-100%); animation: v2shine 3.2s ease-in-out infinite;
      }
      @keyframes v2shine { 0%,100% { transform: translateX(-100%); } 50% { transform: translateX(100%); } }
      .v2-promo-icon {
        font-size: 22px; flex-shrink: 0; z-index: 1;
        animation: v2bob 2.6s ease-in-out infinite;
      }
      @keyframes v2bob {
        0%,100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-2px) rotate(5deg); }
      }
      .v2-promo-text { z-index: 1; font-weight: 800; line-height: 1.15; white-space: nowrap; }
      .v2-badge {
        background: linear-gradient(135deg, #ffd166, #ff9a6a);
        color: #4a2a08; font-size: 10px; font-weight: 900;
        padding: 2px 7px; border-radius: 999px; letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(255,209,102,.7);
        margin-left: 6px; vertical-align: middle;
        animation: v2badgepulse 2s ease-in-out infinite;
      }
      @keyframes v2badgepulse {
        0%,100% { box-shadow: 0 0 6px rgba(255,209,102,.5); }
        50%     { box-shadow: 0 0 14px rgba(255,209,102,.9); }
      }
      .v2-promo-btn {
        background: #fff; color: #6a4fb8; padding: 5px 12px; border-radius: 10px;
        font-weight: 900; font-size: 12px; z-index: 1; white-space: nowrap;
      }
      @media (max-width: 640px) {
        .v2-promo-wrap { text-align: center; }
      }
    </style>
    <!-- V2_PROMO_BANNER -->
    <div class="v2-promo-wrap">
      <a class="v2-promo-card" href="v2/">
        <span class="v2-promo-icon">🎮</span>
        <span class="v2-promo-text">Игровая версия<span class="v2-badge">V2 · NEW</span></span>
        <span class="v2-promo-btn">Играть →</span>
      </a>
    </div>


    <main class="container">
        <section class="page-header">
            <img src="images/mascot.png" alt="Сонное облачко" class="mascot mascot-float">
            <h1>Викторина Снов 🏆</h1>
            <p>Отвечай на интересные вопросы про сон и зарабатывай звёздочки!</p>
        </section>

        <section class="quiz-container">
            <div id="quiz-content">
                <div class="quiz-question" id="question-text">Загрузка вопроса...</div>
                <div class="quiz-options" id="options-container">
                    <!-- Кнопки генерируются через JS -->
                </div>
                <div class="quiz-result" id="quiz-message"></div>
                <button class="next-btn" id="next-question-btn">Следующий вопрос ➡️</button>
            </div>
        </section>
    </main>

    <script src="js/gamification.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/v2.js?v=2.0" defer></script>
</body>

</html>
