<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина о сне - СоноТрекер 🏆</title>
    <link rel="stylesheet" href="css/styles.css?v=2.0">
    <link rel="stylesheet" href="css/v2.css?v=2.0">
    <style>
        .quiz-container {
            background: white;
            border-radius: var(--border-radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid var(--primary-yellow);
        }
        .quiz-question {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-purple);
            margin-bottom: 2rem;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .quiz-btn {
            background: var(--bg-soft);
            border: 2px solid var(--bg-lavender);
            color: var(--text-dark);
            padding: 1.2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .quiz-btn:hover {
            background: white;
            border-color: var(--primary-purple);
            transform: translateX(5px);
            box-shadow: var(--shadow-soft);
        }
        .quiz-btn.correct {
            background: var(--primary-mint);
            color: white;
            border-color: var(--primary-mint);
        }
        .quiz-btn.wrong {
            background: #ff7675;
            color: white;
            border-color: #ff7675;
        }
        .quiz-result {
            margin-top: 2rem;
            font-size: 1.2rem;
            font-weight: 800;
            display: none;
        }
        .next-btn {
            margin-top: 1.5rem;
            display: none;
            width: 100%;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="images/mascot.png" alt="Облачко" class="logo-icon">
                    СоноТрекер
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">🏠 Главная</a></li>
                        <li><a href="sleep-phases.html">🌙 Фазы сна</a></li>
                        <li><a href="sleep-tips.html">💡 Советы</a></li>
                        <li><a href="sleep-statistics.html">📊 Статистика</a></li>
                        <li><a href="ai-helper.html">🤖 Облачко</a></li>
                        <li><a href="sleep-quiz.html">🏆 Викторина</a></li>
                    </ul>
                </nav>
                <div class="user-stats" id="user-stats-container">
                    <span class="stat-badge star-bg" title="Твои звёздочки">⭐ <span id="total-stars">0</span></span>
                    <span class="stat-badge streak-bg" title="Дней подряд">🔥 <span id="current-streak">0</span></span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="page-header">
            <img src="images/mascot.png" alt="Сонное облачко" class="mascot mascot-float">
            <h1>Викторина Снов 🏆</h1>
            <p>Отвечай на интересные вопросы про сон и зарабатывай звёздочки!</p>
        </section>

        <section class="quiz-container">
            <div id="quiz-content">
                <div class="quiz-question" id="question-text">Загрузка вопроса...</div>
                <div class="quiz-options" id="options-container">
                    <!-- Кнопки генерируются через JS -->
                </div>
                <div class="quiz-result" id="quiz-message"></div>
                <button class="next-btn" id="next-question-btn">Следующий вопрос ➡️</button>
            </div>
        </section>
    </main>

    <script src="js/gamification.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/v2.js?v=2.0" defer></script>
</body>

</html>
