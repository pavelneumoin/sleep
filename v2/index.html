<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>СоноТрекер — твой облачный друг 💤</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6a4fb8">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Comfortaa:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #1d1540;
    --ink-s:      #4a3d7a;
    --ink-mute:   #8a7bb0;
    --lav:        #8b6fd4;
    --lav-d:      #6a4fb8;
    --lav-l:      #c2b1ed;
    --peach:      #ffb891;
    --peach-d:    #ff9a6a;
    --pink:       #ffb0c8;
    --mint:       #8fd6bd;
    --mint-d:     #5cbd9e;
    --sun:        #ffd166;
    --sun-d:      #c99a3c;
    --night1:     #2a1f4a;
    --night2:     #3d2a6b;
    --ring:       rgba(106,79,184,.14);
    --shadow:     0 12px 34px rgba(106,79,184,.12);
    --card:       #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 10% -5%, #f4e6ff 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 10%, #ffe8d9 0%, transparent 55%),
      linear-gradient(180deg, #fbf6ff 0%, #fff7f0 55%, #f3eeff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  h1, h2, h3 { font-family: 'Comfortaa', 'Nunito', sans-serif; margin: 0; }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 0 16px 104px;
  }

  /* === Header === */
  .top {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 4px 10px;
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(251,246,255,0.96), rgba(251,246,255,0.85));
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .logo { font-family: 'Comfortaa', sans-serif; font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 6px; }
  .logo .moon { font-size: 22px; filter: drop-shadow(0 2px 4px rgba(106,79,184,.2)); }
  .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #fff; border: 1.5px solid var(--ring); border-radius: 999px;
    padding: 6px 10px; font-size: 13px; font-weight: 800; color: var(--ink);
  }
  .chip.star { background: linear-gradient(135deg, #fff8df, #ffeaa8); border-color: rgba(201,154,60,.28); }
  .chip.fire { background: linear-gradient(135deg, #ffe2e8, #ffc6d6); border-color: rgba(225,29,72,.18); color: #8a1f3a; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #fff; border: 1.5px solid var(--ring);
    display: grid; place-items: center; font-size: 16px; color: var(--ink-s);
  }

  /* === Hero === */
  .hero {
    margin-top: 6px;
    background:
      radial-gradient(300px 160px at 50% 30%, rgba(196,170,255,.35), transparent 70%),
      linear-gradient(135deg, #efe5ff 0%, #ffe4f1 50%, #fff4e1 100%);
    border-radius: 30px; padding: 20px 18px 24px;
    position: relative; overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.7);
    box-shadow: var(--shadow);
  }
  .hero::before {
    content: ''; position: absolute; top: 12px; right: 14px;
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    box-shadow: -30px 10px 0 -2px #fff, 18px 30px 0 -3px #fff, -60px 40px 0 -2px #fff, 40px 8px 0 -3px #fff;
    opacity: .8; animation: tw 3s ease-in-out infinite;
  }
  @keyframes tw { 0%,100%{opacity:.5} 50%{opacity:1} }
  .greet { font-size: 13px; font-weight: 800; color: var(--ink-s); margin-bottom: 2px; }
  .greet .name { color: var(--lav-d); }
  .cloud-wrap { display: grid; place-items: center; margin: 8px 0 14px; position: relative; }
  .cloud { width: 180px; height: 140px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
  .cloud-msg {
    position: absolute; top: 6px; right: 18px; background: #fff;
    border: 1.5px solid var(--ring); border-radius: 14px; padding: 6px 10px;
    font-size: 11.5px; font-weight: 800; color: var(--ink-s); max-width: 150px;
    animation: pop .4s ease-out;
  }
  .cloud-msg::after {
    content: ''; position: absolute; bottom: -7px; left: 18px;
    width: 12px; height: 12px; background: #fff;
    border-right: 1.5px solid var(--ring); border-bottom: 1.5px solid var(--ring);
    transform: rotate(45deg);
  }
  @keyframes pop { from {opacity:0;transform:scale(.8)} to{opacity:1;transform:scale(1)} }
  .title-row { text-align: center; margin-bottom: 14px; }
  .title-row .big { font-size: 22px; font-weight: 900; color: var(--ink); }
  .title-row .small { font-size: 13px; font-weight: 700; color: var(--ink-s); margin-top: 2px; }

  /* === Main big button === */
  .main-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px 20px; border-radius: 22px;
    font-size: 18px; font-weight: 900; color: #fff; border: none;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 0 rgba(106,79,184,.3), 0 14px 30px rgba(106,79,184,.22);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .main-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(106,79,184,.3); }
  .main-btn.night { background: linear-gradient(135deg, #6a4fb8 0%, #8b6fd4 60%, #c2b1ed 100%); }
  .main-btn.morning {
    background: linear-gradient(135deg, #ff9a6a 0%, #ffd166 80%);
    box-shadow: 0 8px 0 rgba(201,154,60,.35), 0 14px 30px rgba(255,154,106,.28);
    color: #4a2a08;
  }
  .main-btn.morning:active { box-shadow: 0 4px 0 rgba(201,154,60,.35); }
  .main-btn .emo { font-size: 22px; }
  .main-btn-hint { text-align: center; font-size: 12px; color: var(--ink-mute); margin-top: 8px; font-weight: 700; }

  /* === Flow pickers === */
  .flow-step {
    margin-top: 14px; background: #fff; border-radius: 22px;
    padding: 16px; border: 1.5px solid var(--ring); animation: pop .3s ease-out;
  }
  .flow-step h3 { font-size: 16px; font-weight: 800; text-align: center; margin-bottom: 10px; }
  .flow-step .sub { text-align: center; font-size: 12px; color: var(--ink-mute); margin-bottom: 12px; }
  .picker-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .picker-btn {
    flex: 1; min-width: 70px; max-width: 120px;
    background: #fff; border: 2.5px solid var(--ring); border-radius: 18px;
    padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 800; color: var(--ink-s); transition: all .15s;
  }
  .picker-btn .big { font-size: 30px; }
  .picker-btn:hover { transform: translateY(-2px); }
  .picker-btn.on {
    border-color: var(--lav);
    background: linear-gradient(135deg, #f4ecff, #ffe4f1);
    color: var(--lav-d);
    box-shadow: 0 6px 18px rgba(106,79,184,.2);
  }
  .flow-actions { display: flex; gap: 8px; margin-top: 14px; }
  .flow-actions button { flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 800; border: none; }
  .flow-actions .save { background: linear-gradient(135deg, var(--mint), var(--mint-d)); color: #0d3b2c; box-shadow: 0 4px 0 #4a9c82; }
  .flow-actions .back { background: #f3ecff; color: var(--ink-s); }
  .duration-show { text-align: center; margin-bottom: 12px; font-size: 13px; color: var(--ink-s); }
  .duration-show .d {
    font-size: 32px; font-weight: 900;
    background: linear-gradient(135deg, var(--lav-d), var(--peach));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* === Sections === */
  .section { margin-top: 22px; }
  .section-h { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 10px; }
  .section-h h2 { font-size: 18px; font-weight: 900; }
  .section-h .hint { font-size: 11.5px; color: var(--ink-mute); font-weight: 700; }

  /* === Weekly Challenge === */
  .wc-card {
    margin-top: 16px;
    background: linear-gradient(135deg, #fff8e0 0%, #ffe8d0 50%, #ffd9e6 100%);
    border: 2px solid rgba(255,161,90,.35);
    border-radius: 22px;
    padding: 12px 14px;
    position: relative; overflow: hidden;
    box-shadow: 0 10px 24px rgba(255,154,106,.16);
  }
  .wc-card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform: translateX(-100%); animation: wcshine 4s ease-in-out infinite;
  }
  @keyframes wcshine { 0%,100% { transform: translateX(-100%); } 50% { transform: translateX(100%); } }
  .wc-card.wc-done {
    background: linear-gradient(135deg, #d8f5e5 0%, #c4f2d9 100%);
    border-color: rgba(92,189,158,.5);
  }
  .wc-label {
    display: inline-block; font-size: 10.5px; font-weight: 900; letter-spacing: 1.2px;
    color: #fff; background: linear-gradient(135deg, #ff9a6a, #ff7a9d);
    padding: 3px 10px; border-radius: 999px;
    margin-bottom: 10px;
  }
  .wc-card.wc-done .wc-label { background: linear-gradient(135deg, #5cbd9e, #3d9a7e); }
  .wc-main { display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .wc-icon {
    font-size: 38px; flex-shrink: 0;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.12));
    animation: wcbob 2.4s ease-in-out infinite;
  }
  @keyframes wcbob {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%     { transform: translateY(-3px) rotate(4deg); }
  }
  .wc-body { flex: 1; min-width: 0; }
  .wc-title { font-size: 15px; font-weight: 900; color: var(--ink); line-height: 1.2; margin-bottom: 2px; }
  .wc-desc { font-size: 12px; color: var(--ink-s); font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
  .wc-bar { height: 9px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; margin-bottom: 5px; border: 1px solid rgba(0,0,0,.05); }
  .wc-bar-fill {
    height: 100%; background: linear-gradient(90deg, #ffd166, #ff9a6a);
    border-radius: 999px; transition: width .4s;
  }
  .wc-card.wc-done .wc-bar-fill { background: linear-gradient(90deg, #8fd6bd, #5cbd9e); }
  .wc-foot { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: var(--ink-s); }
  .wc-reward { color: var(--sun-d); }
  .wc-card.wc-done .wc-reward { color: var(--mint-d); }

  /* === Levels === */
  .levels-scroll {
    display: flex; gap: 12px; overflow-x: auto;
    padding: 2px 4px 14px; scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .levels-scroll::-webkit-scrollbar { display: none; }
  .lvl-card {
    flex: 0 0 170px; scroll-snap-align: start;
    background: #fff; border: 2px solid var(--ring); border-radius: 22px;
    padding: 14px 14px 12px; position: relative; transition: all .2s;
  }
  .lvl-card.done {
    background: linear-gradient(135deg, #e8fbf0, #c4f2d9);
    border-color: rgba(92,189,158,.4);
  }
  .lvl-card.locked { opacity: .55; filter: grayscale(.3); }
  .lvl-icon { font-size: 30px; filter: drop-shadow(0 3px 6px rgba(106,79,184,.2)); }
  .lvl-card.done .lvl-icon::after {
    content: '✓'; position: absolute; top: 10px; right: 12px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--mint-d); color: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: 12px;
  }
  .lvl-num { display: inline-block; background: var(--lav-l); color: var(--lav-d); font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 999px; margin-bottom: 4px; letter-spacing: .5px; }
  .lvl-name { font-size: 14px; font-weight: 900; line-height: 1.15; margin-bottom: 2px; }
  .lvl-desc { font-size: 11px; color: var(--ink-mute); font-weight: 700; line-height: 1.3; margin-bottom: 10px; min-height: 28px; }
  .lvl-bar { height: 8px; background: #efe8ff; border-radius: 999px; overflow: hidden; margin-bottom: 6px; }
  .lvl-bar-fill { height: 100%; background: linear-gradient(90deg, var(--lav), var(--peach)); border-radius: 999px; transition: width .4s; }
  .lvl-card.done .lvl-bar-fill { background: linear-gradient(90deg, var(--mint), var(--mint-d)); }
  .lvl-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; color: var(--ink-s); }
  .lvl-foot .reward { color: var(--sun-d); }

  /* === Constellation === */
  .constellation-card {
    background: linear-gradient(180deg, var(--night1) 0%, var(--night2) 100%);
    border-radius: 24px; padding: 16px; color: #fff;
    position: relative; overflow: hidden;
  }
  .constellation-card::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(2px 2px at 20% 20%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 70% 40%, rgba(255,255,255,.3), transparent),
      radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 85% 80%, rgba(255,255,255,.3), transparent);
    pointer-events: none;
  }
  .cons-title { font-size: 14px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: relative; }
  .cons-title .count { font-size: 12px; font-weight: 700; color: var(--lav-l); background: rgba(255,255,255,.08); padding: 3px 8px; border-radius: 999px; }
  .cons-svg { width: 100%; height: 180px; display: block; }
  .cons-caption { font-size: 11.5px; text-align: center; color: rgba(255,255,255,.75); margin-top: 6px; font-weight: 700; }
  .cons-empty { text-align: center; padding: 30px 12px; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 700; }

  /* === History === */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .log-card {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1.5px solid var(--ring); border-radius: 16px;
    padding: 12px 14px;
  }
  .log-emoji { font-size: 28px; flex-shrink: 0; }
  .log-main { flex: 1; min-width: 0; }
  .log-date { font-size: 12px; color: var(--ink-mute); font-weight: 700; }
  .log-dur  { font-size: 15px; font-weight: 900; }
  .log-time { font-size: 11px; color: var(--ink-s); margin-top: 2px; }
  .log-quality { font-size: 22px; flex-shrink: 0; }
  .empty-state {
    text-align: center; padding: 22px 16px;
    background: #fff; border: 1.5px dashed var(--ring); border-radius: 20px;
    color: var(--ink-mute); font-size: 13px; font-weight: 700;
  }

  /* === Tabs (bottom nav) === */
  .tabs {
    position: fixed; bottom: 12px; left: 12px; right: 12px;
    max-width: 536px; margin: 0 auto;
    background: rgba(255,255,255,0.95);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1.5px solid var(--ring); border-radius: 24px;
    padding: 6px; z-index: 20;
    display: flex; gap: 2px;
    box-shadow: 0 12px 32px rgba(106,79,184,.18);
  }
  .tabs button {
    flex: 1; padding: 8px 4px; border: none; background: transparent;
    border-radius: 18px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 800; color: var(--ink-mute);
    transition: all .15s;
  }
  .tabs button .ico { font-size: 20px; filter: grayscale(.4); opacity: .7; }
  .tabs button.active {
    background: linear-gradient(135deg, #f4ecff, #ffe4f1);
    color: var(--lav-d);
  }
  .tabs button.active .ico { filter: none; opacity: 1; }

  /* === Tip cards (collectible) === */
  .tip-hero {
    background: linear-gradient(135deg, #6a4fb8 0%, #8b6fd4 100%);
    color: #fff;
    border-radius: 26px;
    padding: 20px; margin-top: 8px;
    position: relative; overflow: hidden;
    text-align: center;
  }
  .tip-hero::before {
    content: ''; position: absolute; inset: -30%;
    background: radial-gradient(circle, rgba(255,209,102,.3) 0%, transparent 60%);
    animation: rotate 15s linear infinite;
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .tip-hero > * { position: relative; }
  .tip-hero h2 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .tip-hero .tip-sub { font-size: 13px; opacity: .85; font-weight: 700; margin-bottom: 14px; }

  .tip-claim-btn {
    padding: 14px 22px;
    border-radius: 999px;
    font-size: 15px; font-weight: 900;
    background: linear-gradient(135deg, #ffd166, #ff9a6a);
    color: #4a2a08;
    box-shadow: 0 5px 0 #c99a3c, 0 10px 24px rgba(255,154,106,.35);
    transition: transform .15s, box-shadow .15s;
  }
  .tip-claim-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c99a3c; }
  .tip-claim-btn:disabled { opacity: .6; cursor: not-allowed; filter: grayscale(.3); }

  .tip-progress { margin-top: 12px; font-size: 12px; font-weight: 800; opacity: .9; }

  .cards-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-top: 14px;
  }
  @media (max-width: 380px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .tip-card {
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    padding: 12px 8px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center;
    position: relative; overflow: hidden;
    cursor: pointer;
    transition: transform .18s;
    border: 2px solid transparent;
  }
  .tip-card:hover { transform: translateY(-3px); }
  .tip-card.locked {
    background: repeating-linear-gradient(135deg, #e9e2f7, #e9e2f7 8px, #dfd5f0 8px, #dfd5f0 16px);
    color: var(--ink-mute);
    border-color: rgba(106,79,184,.15);
    cursor: default;
  }
  .tip-card.locked .tip-icon { opacity: .3; }
  .tip-card.common    { background: linear-gradient(150deg, #e7f3ff, #c9dff5); border-color: #8ec6f5; color: #1b3c5a; }
  .tip-card.rare      { background: linear-gradient(150deg, #e6ffe9, #a8e2b6); border-color: #5cbd9e; color: #0d3b2c; }
  .tip-card.epic      { background: linear-gradient(150deg, #f6e9ff, #d3b3f2); border-color: var(--lav); color: var(--lav-d); }
  .tip-card.legendary {
    background: linear-gradient(150deg, #fff6d9, #ffd166, #ff9a6a);
    border-color: #c99a3c; color: #4a2a08;
    box-shadow: 0 8px 24px rgba(255,154,106,.3);
    animation: legend 3s ease-in-out infinite;
  }
  @keyframes legend {
    0%,100% { box-shadow: 0 8px 24px rgba(255,154,106,.3); }
    50%     { box-shadow: 0 8px 30px rgba(255,209,102,.6); }
  }
  .tip-icon { font-size: 34px; margin-top: 4px; }
  .tip-title { font-size: 11px; font-weight: 900; line-height: 1.15; padding: 0 2px; }
  .tip-rarity {
    font-size: 8.5px; font-weight: 900; letter-spacing: .5px;
    padding: 2px 6px; border-radius: 999px;
    background: rgba(255,255,255,.5);
    text-transform: uppercase;
  }

  /* === Tip reveal overlay === */
  .reveal-bg {
    position: fixed; inset: 0;
    background: radial-gradient(circle, rgba(106,79,184,.7) 0%, rgba(29,21,64,.92) 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 500;
    animation: pop .3s ease-out;
  }
  .reveal-card {
    width: 100%; max-width: 320px;
    background: #fff;
    border-radius: 28px;
    padding: 28px 22px 22px;
    text-align: center;
    position: relative;
    animation: revealIn .7s cubic-bezier(.2,1.4,.4,1) forwards;
    transform-style: preserve-3d;
  }
  @keyframes revealIn {
    0%   { transform: scale(.3) rotate(-180deg); opacity: 0; }
    70%  { transform: scale(1.06) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }
  .reveal-card .icn { font-size: 60px; margin-bottom: 8px; filter: drop-shadow(0 5px 15px rgba(255,209,102,.5)); }
  .reveal-card .rarity-tag {
    display: inline-block;
    font-size: 11px; font-weight: 900; letter-spacing: 1.2px;
    padding: 4px 12px; border-radius: 999px;
    margin-bottom: 8px;
  }
  .reveal-card.common    .rarity-tag { background: #c9dff5; color: #1b3c5a; }
  .reveal-card.rare      .rarity-tag { background: #a8e2b6; color: #0d3b2c; }
  .reveal-card.epic      .rarity-tag { background: #d3b3f2; color: var(--lav-d); }

<script>
/* ==================================================== */
/* SonoTracker v2 — full app                            */
/* ==================================================== */
(function(){

/* ===================== STORAGE ===================== */
const KEY = 'sono-v2';
const defaultState = {
  name: '',
  logs: [],                 // {id,date,sleepAt,wakeAt,quality,dream,duration}
  pending: null,            // {sleepAt}
  unlockedLevels: [],
  unlockedAchievements: [], // ['ach_id', ...]
  unlockedTips: [],         // ['tip_id', ...]
  viewedVideos: [],         // ['vid_id', ...]
  quizHighScore: 0,
  quizAttempts: 0,
  lastDailyBonus: null,     // 'YYYY-MM-DD'
  lastTipClaim: null,       // 'YYYY-MM-DD'
  claimedChallenge: null,   // 'YYYY-Wxx' — неделя, за которую уже получена награда
  stars: 0,
};
function load(){
  try { return Object.assign({}, defaultState, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ return {...defaultState}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
let state = load();

/* ===================== HELPERS ===================== */
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => {
  const d = new Date(iso);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(today.getDate()-1);
  const day = new Date(iso); day.setHours(0,0,0,0);
  if (+day === +today) return 'Сегодня';
  if (+day === +yest)  return 'Вчера';
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + months[d.getMonth()];
};
const fmtTime = (iso) => {
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
};
const fmtDur = (min) => {
  const h = Math.floor(min/60), m = min%60;
  return h + 'ч ' + (m<10?'0':'') + m + 'м';
};
const hourOfLocal = (iso) => new Date(iso).getHours();

function computeStreak(logs){
  if (!logs.length) return 0;
  const dates = new Set(logs.map(l => l.date));
  let streak = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  while (dates.has(d.toISOString().slice(0,10))) { streak++; d.setDate(d.getDate()-1); }
  return streak;
}

/* ===================== WEEK HELPERS ===================== */
function mondayOfWeek(d){
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const dayNr = (dt.getDay() + 6) % 7; // 0 = Monday
  dt.setDate(dt.getDate() - dayNr);
  return dt;
}
function weekKey(d = new Date()){
  const mon = mondayOfWeek(d);
  // ISO-ish: year + week number based on Monday
  const yearStart = new Date(mon.getFullYear(), 0, 1);
  const week = Math.ceil(((mon - yearStart) / 86400000 + 1) / 7);
  return mon.getFullYear() + '-W' + String(week).padStart(2, '0');
}
function isThisWeek(iso){
  const d = new Date(iso); d.setHours(0,0,0,0);
  const mon = mondayOfWeek(new Date());
  const next = new Date(mon); next.setDate(mon.getDate() + 7);
  return d >= mon && d < next;
}

/* ===================== LEVELS ===================== */
const LEVELS = [
  { id: 1,  icon: '🌱', name: 'Первые шаги',       desc: 'Запиши сон 3 ночи',     goal: 3,  reward: 10,  check: (logs) => logs.length },
  { id: 2,  icon: '🌙', name: 'Лунный новичок',    desc: 'Запиши 5 ночей',        goal: 5,  reward: 15,  check: (logs) => logs.length },
  { id: 3,  icon: '⏰', name: 'Точно ко сну',      desc: 'Ложись до 22:00 × 3',   goal: 3,  reward: 20,  check: (logs) => logs.filter(l => { const h = hourOfLocal(l.sleepAt); return h >= 18 && h < 22; }).length },
  { id: 4,  icon: '🛏️', name: 'Выспался!',         desc: 'Спи 9+ часов 5 раз',    goal: 5,  reward: 25,  check: (logs) => logs.filter(l => l.duration >= 540).length },
  { id: 5,  icon: '🔥', name: 'Неделя подряд',     desc: '7 дней без пропусков',  goal: 7,  reward: 40,  check: (logs) => computeStreak(logs) },
  { id: 6,  icon: '🦄', name: 'Коллекционер снов', desc: 'Все 4 типа снов',       goal: 4,  reward: 30,  check: (logs) => new Set(logs.map(l => l.dream).filter(Boolean)).size },
  { id: 7,  icon: '😊', name: 'Волна радости',     desc: '5 снов с оценкой 😊',   goal: 5,  reward: 30,  check: (logs) => logs.filter(l => l.quality === 3).length },
  { id: 8,  icon: '🌞', name: 'Жаворонок-мастер',  desc: 'Проснись до 07:00 × 5', goal: 5,  reward: 35,  check: (logs) => logs.filter(l => hourOfLocal(l.wakeAt) < 7).length },
  { id: 9,  icon: '🎴', name: 'Коллекционер карт', desc: 'Собери 10 советов',     goal: 10, reward: 50,  check: () => state.unlockedTips.length },
  { id: 10, icon: '🧠', name: 'Умник',             desc: 'Викторина 9+ из 10',    goal: 9,  reward: 40,  check: () => state.quizHighScore },
  { id: 11, icon: '👑', name: 'Мастер снов',       desc: '21 ночь записана',      goal: 21, reward: 100, check: (logs) => logs.length },
  { id: 12, icon: '🌌', name: 'Легенда сна',       desc: '50 ночей записано',     goal: 50, reward: 200, check: (logs) => logs.length },
];

/* ===================== ACHIEVEMENTS ===================== */
const ACHIEVEMENTS = [
  { id: 'first_log',     icon: '✨',   name: 'Первый сон',       desc: 'Запиши первую ночь',              check: (s) => s.logs.length >= 1 },
  { id: 'week_logger',   icon: '📅',   name: 'Неделя знаний',     desc: '7 ночей записано',                check: (s) => s.logs.length >= 7 },
  { id: 'early_bird',    icon: '🐦',   name: 'Жаворонок',         desc: 'Проснись до 07:00 × 3',           check: (s) => s.logs.filter(l => hourOfLocal(l.wakeAt) < 7).length >= 3 },
  { id: 'ultra_early',   icon: '🌅',   name: 'Рассветный',        desc: 'Проснись до 06:00 × 2',           check: (s) => s.logs.filter(l => hourOfLocal(l.wakeAt) < 6).length >= 2 },
  { id: 'night_owl',     icon: '🦉',   name: 'Ночная сова',       desc: 'Ложись после 23:00',              check: (s) => s.logs.some(l => hourOfLocal(l.sleepAt) >= 23 || hourOfLocal(l.sleepAt) <= 4) },
  { id: 'long_sleep',    icon: '💤',   name: 'Соня-чемпион',      desc: 'Спи 10+ часов',                   check: (s) => s.logs.some(l => l.duration >= 600) },
  { id: 'marathon',      icon: '😴',   name: 'Марафон сна',       desc: 'Спи 11+ часов',                   check: (s) => s.logs.some(l => l.duration >= 660) },
  { id: 'collector',     icon: '🎴',   name: 'Коллекционер',      desc: 'Собери 5 карточек',               check: (s) => s.unlockedTips.length >= 5 },
  { id: 'tip_hunter',    icon: '🎯',   name: 'Охотник за советами', desc: 'Собери 10 карточек',            check: (s) => s.unlockedTips.length >= 10 },
  { id: 'legendary_card',icon: '🌟',   name: 'Легендарная карта', desc: 'Получи легендарную карточку',     check: (s) => s.unlockedTips.some(id => { const t = TIPS.find(x => x.id === id); return t && t.rarity === 'legendary'; }) },
  { id: 'all_cards',     icon: '🏵️',  name: 'Полная коллекция',  desc: 'Все карточки собраны',            check: (s) => s.unlockedTips.length >= TIPS.length },
  { id: 'scholar',       icon: '📚',   name: 'Знаток сна',        desc: 'Викторина 8+ из 10',              check: (s) => s.quizHighScore >= 8 },
  { id: 'genius',        icon: '🧠',   name: 'Гений',             desc: 'Викторина 10 из 10',              check: (s) => s.quizHighScore >= 10 },
  { id: 'quiz_master',   icon: '🎓',   name: 'Магистр викторин',  desc: '5 раз прошёл викторину',          check: (s) => s.quizAttempts >= 5 },

function currentChallenge(){
  const mon = mondayOfWeek(new Date());
  // детерминированный выбор: дни от эпохи div 7
  const weeks = Math.floor(mon.getTime() / (7 * 86400000));
  return CHALLENGES[weeks % CHALLENGES.length];
}
function challengeProgress(){
  const ch = currentChallenge();
  const cur = Math.min(ch.check(state.logs), ch.goal);
  const done = cur >= ch.goal;
  const wk = weekKey();
  const claimed = state.claimedChallenge === wk;
  return { ch, cur, goal: ch.goal, done, claimed, wk };
}
function checkWeeklyChallenge(){
  const p = challengeProgress();
  if (p.done && !p.claimed) {
    state.claimedChallenge = p.wk;
    state.stars += p.ch.reward;
    return p.ch;
  }
  return null;
}

function cloudMood(){
  const streak = computeStreak(state.logs);
  const last = state.logs[0];
  const hasToday = last && last.date === todayISO();
  const now = new Date();
  if (streak >= 7) return { key:'king',    msg:'Я король снов! 👑' };
  if (streak >= 3) return { key:'pyjama',  msg:'Нам вместе уютно 🩷' };
  if (last && last.quality === 1) return { key:'sleepy', msg:'Ты мало поспал...' };
  if (!hasToday && now.getHours() >= 21) return { key:'waiting', msg:'Пора записать!' };
  return { key:'happy', msg:null };
}

function constellationSVG(){
  const logs = state.logs.slice().reverse();
  if (!logs.length) return '<div class="cons-empty">🌌 Созвездие появится, когда ты запишешь первую ночь</div>';
  const W = 360, H = 180;
  function hash(str){ let h = 0; for (let i=0;i<str.length;i++) { h = ((h<<5) - h) + str.charCodeAt(i); h |= 0; } return Math.abs(h); }
  const stars = logs.map((l, i) => {
    const hx = hash(l.id + 'x'), hy = hash(l.id + 'y');
    const x = 30 + (hx % (W - 60));
    const y = 25 + (hy % (H - 50));
    const size = l.quality === 3 ? 4 : l.quality === 2 ? 3 : 2.2;
    const glow = l.duration >= 540 ? 1 : 0;
    return { x, y, size, glow, i, q: l.quality };
  });
  const lines = [];
  for (let i = 1; i < stars.length; i++) {
    const a = stars[i-1], b = stars[i];
    lines.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(255,255,255,.18)" stroke-width="0.8"/>`);
  }
  const starsSvg = stars.map(s => {
    const color = s.q === 3 ? '#ffd166' : s.q === 2 ? '#c2b1ed' : '#8a7bb0';
    const glowRing = s.glow ? `<circle cx="${s.x}" cy="${s.y}" r="${s.size+4}" fill="none" stroke="${color}" stroke-width=".5" opacity=".3"/>` : '';
    return `${glowRing}<circle cx="${s.x}" cy="${s.y}" r="${s.size}" fill="${color}"><animate attributeName="opacity" values="0.6;1;0.6" dur="${2+s.i%3}s" repeatCount="indefinite"/></circle>`;
  }).join('');
  const name = state.name || 'твоё';
  return `
    <svg class="cons-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${lines.join('')}${starsSvg}
    </svg>
    <div class="cons-caption">Созвездие ${name==='твоё'?'твоё':('«'+name+'»')} · ${stars.length} ${stars.length===1?'ночь':(stars.length<5?'ночи':'ночей')}</div>`;
}

/* ===================== LEVEL & ACHIEVEMENT CHECK ===================== */
function levelProgress(){
  return LEVELS.map(lvl => {
    const cur = lvl.check(state.logs);
    const done = cur >= lvl.goal;
    return { ...lvl, cur: Math.min(cur, lvl.goal), done };
  });
}
function checkLevelUps(){
  const newly = [];
  levelProgress().forEach(lvl => {
    if (lvl.done && !state.unlockedLevels.includes(lvl.id)) {
      state.unlockedLevels.push(lvl.id);
      state.stars += lvl.reward;
      newly.push(lvl);
    }
  });
  return newly;
}
function checkAchievements(){
  const newly = [];
  ACHIEVEMENTS.forEach(ach => {
    if (ach.check(state) && !state.unlockedAchievements.includes(ach.id)) {
      state.unlockedAchievements.push(ach.id);
      state.stars += 5;
      newly.push(ach);
    }
  });
  return newly;
}

/* ===================== PLAYER LEVEL (from stars) ===================== */
// every 50 stars = +1 player level
function playerLevel(){
  const l = Math.floor(state.stars / 50) + 1;
  const cur = state.stars % 50;
  return { level: l, cur, max: 50, pct: Math.round(cur / 50 * 100) };
}

}

  const goodNights = logs.filter(l => l.quality === 3).length;

  // heatmap (last 28 days = 2 rows of 14)
  const days = 28;
  const dateMap = {};
  logs.forEach(l => { dateMap[l.date] = l; });
  const cells = [];

  for (let i = days-1; i >= 0; i--) {

  return `
    <div class="stat-hero">
      <div class="player-lvl">ТВОЙ УРОВЕНЬ ИГРОКА</div>
      <div class="player-lvl-num">${p.level}</div>
      <div class="player-xp-bar"><div class="player-xp-bar-fill" style="width:${p.pct}%"></div></div>

        <h2>📖 История</h2>

    </div>
  `;
}
function calcBestStreak(logs){
  if (!logs.length) return 0;
  const dates = [...new Set(logs.map(l => l.date))].sort();
  let best = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    const a = new Date(dates[i-1]), b = new Date(dates[i]);
    const diff = Math.round((b - a) / 86400000);
    if (diff === 1) { cur++; best = Math.max(best, cur); }
    else cur = 1;
  }
  return best;
}

/* ===================== QUIZ TAB ===================== */
function renderQuiz(){
  const run = localUi.quizRun;
  if (!run) {
    return `
      <div class="quiz-hero">
        <h2>🧠 Викторина о сне</h2>
        <div class="sub">10 вопросов из ${QUIZ.length} случайных · +2 ⭐ за верный ответ</div>
        <div class="best">🏆 Рекорд: ${state.quizHighScore} / 10 · попыток: ${state.quizAttempts}</div><br>
        <button class="quiz-start-btn" onclick="SONO.startQuiz()">Начать викторину</button>
      </div>
    `;
  }
  if (run.finished) {
    const score = run.score;
    const total = run.total;
    let emoji, title, sub;
    if (score === total)          { emoji = '🏆'; title = 'ГЕНИЙ СНА!';    sub = 'Ты знаешь всё о сне!'; }
    else if (score >= total*0.8)  { emoji = '🌟'; title = 'Знаток сна';    sub = 'Отличный результат — почти идеально'; }
    else if (score >= total*0.5)  { emoji = '😊'; title = 'Неплохо!';      sub = 'Пробуй ещё — станешь экспертом'; }
    else                          { emoji = '🤓'; title = 'Нужно читать'; sub = 'Загляни в «Советы» — там всё про сон'; }
    return `
      <div class="quiz-result">
        <div class="score-emoji">${emoji}</div>
        <div class="score-num">${score} / ${total}</div>
        <div class="score-title">${title}</div>
        <div class="score-sub">${sub}</div>
        <div style="font-size:12px;color:var(--ink-mute);margin-bottom:12px">+${score*2} ⭐ в копилку</div>
        <button class="retry-btn" onclick="SONO.startQuiz()">Ещё раз →</button>
      </div>
    `;
  }
  const q = QUIZ[run.order[run.idx]];
  const opts = q.opts.map((opt, i) => {
    let cls = 'quiz-opt';
    if (run.answered) {
      if (i === q.correct) cls += ' ok';
      else if (i === run.selectedIdx) cls += ' wrong';
    }
    return `<button class="${cls}" ${run.answered?'disabled':''} onclick="SONO.answerQuiz(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');
  const low = run.remaining <= 5;
  return `
    <div class="quiz-card">
      <div class="quiz-progress">
        <span>Вопрос ${run.idx+1} / ${run.total} · ${run.score} ⭐</span>
        <span class="timer ${low?'low':''}">${run.remaining}с</span>
      </div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">${opts}</div>
      ${run.answered ? `<div style="text-align:center;margin-top:12px"><button class="retry-btn" style="padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;font-weight:900" onclick="SONO.nextQuiz()">${run.idx===run.total-1?'Показать результат':'Следующий →'}</button></div>` : ''}
    </div>
  `;
}

  goNight(){
    state.pending = { sleepAt: new Date().toISOString() };
    save();
    confetti(['#8b6fd4','#c2b1ed','#ffd166']);
    render();
  },
  startMorning(isEdit){
    if (isEdit) {
      const today = state.logs.find(l => l.date === todayISO());
      if (today) {
        state.pending = { sleepAt: today.sleepAt };
        state.logs = state.logs.filter(l => l.id !== today.id);
        save();
      }
    }
    localUi.step = 'quality'; localUi.pickedQuality = null; localUi.pickedDream = null;
    render();
  },
  pickQuality(q){ localUi.pickedQuality = q; render(); },
  pickDream(d){ localUi.pickedDream = d; render(); },
  goNextStep(){ if (!localUi.pickedQuality) return; localUi.step = 'dream'; render(); },
  backStep(){ localUi.step = 'quality'; render(); },
  cancelFlow(){ localUi.step = null; localUi.pickedQuality = null; localUi.pickedDream = null; render(); },
  saveLog(){
    if (!localUi.pickedQuality || !localUi.pickedDream) return;
    if (!state.pending) return;
    const sleepAt = state.pending.sleepAt;
    const wakeAt  = new Date().toISOString();
    const duration = Math.max(1, Math.round((new Date(wakeAt) - new Date(sleepAt)) / 60000));
    const log = {
      id: 'l_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      date: todayISO(),
      sleepAt, wakeAt,
      quality: localUi.pickedQuality,
      dream: localUi.pickedDream,
      duration,
    };
    state.logs.unshift(log);
    state.pending = null;
    state.stars += 5;
    // extra: record before 08:00 → +3
    if (hourOfLocal(wakeAt) < 8) { state.stars += 3; showBonus('🐦 +3 ⭐ за ранний подъём!'); }
    save();
    const newLvls = checkLevelUps();
    const newAchs = checkAchievements();
    const wcDone  = checkWeeklyChallenge();
    save();
    localUi.step = null; localUi.pickedQuality = null; localUi.pickedDream = null;
    render();
    confetti(['#ffd166','#8fd6bd','#ffb0c8','#8b6fd4']);
    if (wcDone) {
      setTimeout(() => { showBonus('⚡ Вызов недели выполнен! +' + wcDone.reward + ' ⭐'); confetti(['#ff9a6a','#ffd166','#ffb0c8']); }, 400);
    } else if (newLvls.length) setTimeout(() => showLevelToast(newLvls[0], 'УРОВЕНЬ!'), 400);
    else if (newAchs.length)   setTimeout(() => showLevelToast(newAchs[0], 'АЧИВКА!'), 400);
  },

  /* Tip actions */
  claimDailyTip(){
    const today = todayISO();
    if (state.lastTipClaim === today) return;
    const locked = TIPS.filter(t => !state.unlockedTips.includes(t.id));
    if (!locked.length) {
      state.lastTipClaim = today;
      save();
      showBonus('🏆 Вся коллекция собрана!');
      return;
    }
    // weighted random: legendary 5%, epic 15%, rare 30%, common 50%
    const rarityWeights = { common: 50, rare: 30, epic: 15, legendary: 5 };
    const pool = [];
    locked.forEach(t => {
      for (let i = 0; i < rarityWeights[t.rarity]; i++) pool.push(t);
    });
    const pick = pool[Math.floor(Math.random() * pool.length)] || locked[0];
    state.unlockedTips.push(pick.id);
    state.lastTipClaim = today;
    state.stars += (pick.rarity === 'legendary' ? 25 : pick.rarity === 'epic' ? 15 : pick.rarity === 'rare' ? 8 : 3);
    save();
    const achs = checkAchievements(); save();
    showTipReveal(pick);
    if (achs.length) setTimeout(() => showLevelToast(achs[0], 'АЧИВКА!'), 1200);
  },
  showTip(id){
    const t = TIPS.find(x => x.id === id);
    if (!t) return;
    showTipReveal(t, true);
  },

  /* Achievement peek */
  showAch(id){
    const a = ACHIEVEMENTS.find(x => x.id === id);
    if (!a) return;
    const got = state.unlockedAchievements.includes(id);
    const html = `
      <button class="modal-close" onclick="document.querySelector('.modal-bg').remove()">✕</button>
      <div style="text-align:center">
        <div style="font-size:70px;margin-bottom:6px;${got?'':'filter:grayscale(1);opacity:.4'}">${a.icon}</div>
        <h2>${got ? a.name : 'Пока закрыта'}</h2>
        <p>${a.desc}</p>
        ${got ? '<p style="color:var(--mint-d);font-weight:800">✓ Получена!</p>' : ''}
      </div>
    `;
    openModal(html);
  },

  /* Quiz actions */
  startQuiz(){
    const total = Math.min(10, QUIZ.length);
    const order = [...Array(QUIZ.length).keys()].sort(()=>Math.random()-0.5).slice(0, total);
    localUi.quizRun = { idx: 0, score: 0, answered: false, selectedIdx: null, timerId: null, remaining: 15, order, total };
    startQuizTimer();
    render();
  },
  answerQuiz(i){
    const r = localUi.quizRun;
    if (!r || r.answered) return;
    r.answered = true;
    r.selectedIdx = i;
    if (r.timerId) clearInterval(r.timerId);
    const q = QUIZ[r.order[r.idx]];
    if (i === q.correct) {
      r.score++;
      state.stars += 2;
      save();
    }
    render();
  },
  nextQuiz(){
    const r = localUi.quizRun;
    if (!r) return;
    r.idx++;
    if (r.idx >= r.total) {
      r.finished = true;
      state.quizAttempts++;
      if (r.score > state.quizHighScore) state.quizHighScore = r.score;
      save();
      const achs = checkAchievements(); save();
      render();
      if (r.score >= 8) confetti(['#ffd166','#8fd6bd','#ffb0c8']);
      if (achs.length) setTimeout(() => showLevelToast(achs[0], 'АЧИВКА!'), 500);
      return;
    }
    r.answered = false; r.selectedIdx = null; r.remaining = 15;
    startQuizTimer();
    render();
  },

  openSettings(){
    const html = `
      <button class="modal-close" onclick="document.querySelector('.modal-bg').remove()">✕</button>
      <h2>⚙️ Настройки</h2>
      <p>Небольшие штуки, чтобы приложение было твоим</p>
      <div class="settings-row">
        <label>Как тебя звать?</label>
        <input id="nm-in" type="text" placeholder="например, Арина" value="${(state.name||'').replace(/"/g,'&quot;')}" maxlength="20"/>
      </div>
      <div class="settings-row">
        <label>Сброс всего</label>
        <button onclick="SONO.resetAll()" style="background:#ffe0e0;color:#c92a47;font-weight:800;padding:8px 14px;border-radius:12px;font-size:13px">Сбросить</button>
      </div>
      <div style="margin-top:14px;text-align:center">
        <button onclick="SONO.saveName()" style="background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;font-weight:900;padding:10px 22px;border-radius:14px;font-size:14px;border:none">Сохранить</button>
      </div>
      <p style="font-size:11px;color:var(--ink-mute);margin-top:14px;text-align:center">v2 · Савкина А. Д., Воронова Д. М. · Рук. Неумоин П. Д. · ГБОУ Школа 2200</p>
    `;
    openModal(html);
    setTimeout(() => { const i = document.getElementById('nm-in'); if (i) i.focus(); }, 30);
  },
  saveName(){
    const inp = document.getElementById('nm-in');
    if (inp) { state.name = inp.value.trim().slice(0, 20); save(); }
    const bg = document.querySelector('.modal-bg'); if (bg) bg.remove();
    render();
  },
  resetAll(){
    if (!confirm('Точно всё стереть? Звёзды, записи, уровни, ачивки, советы — всё.')) return;
    state = { ...defaultState };
    save();
    const bg = document.querySelector('.modal-bg'); if (bg) bg.remove();
    render();
  },
};

/* ===================== QUIZ TIMER ===================== */
function startQuizTimer(){
  const r = localUi.quizRun;
  if (!r) return;
  if (r.timerId) clearInterval(r.timerId);
  r.remaining = 15;
  r.timerId = setInterval(() => {
    if (!localUi.quizRun || localUi.quizRun.answered) {
      clearInterval(r.timerId); return;
    }
    localUi.quizRun.remaining--;
    if (localUi.quizRun.remaining <= 0) {
      clearInterval(localUi.quizRun.timerId);
      SONO.answerQuiz(-1); // out of time
      return;
    }
    // minimal update: just timer text
    const t = document.querySelector('.quiz-progress .timer');
    if (t) {
      t.textContent = localUi.quizRun.remaining + 'с';
      t.classList.toggle('low', localUi.quizRun.remaining <= 5);
    }
  }, 1000);
}

/* ===================== MODALS / FX ===================== */
function openModal(html){
  const prev = document.querySelector('.modal-bg'); if (prev) prev.remove();
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = '<div class="modal">' + html + '</div>';
  wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
}
function confetti(colors){
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  const n = 26;
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.style.left = (Math.random()*100) + '%';
    s.style.background = colors[i % colors.length];
    s.style.animationDuration = (1.1 + Math.random()*1.2) + 's';
    s.style.animationDelay = (Math.random()*.3) + 's';
    s.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
    s.style.borderRadius = (Math.random() > .5) ? '50%' : '2px';
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 2200);
}
function showLevelToast(lvl, label){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `
    <span class="big">${lvl.icon}</span>
    <div class="t1">${label || 'НОВЫЙ УРОВЕНЬ!'}</div>
    <div class="t2">${lvl.name}</div>
    <div class="t3">${lvl.reward ? ('+'+lvl.reward+' звёздочек') : '+5 звёздочек'}</div>
    <button onclick="this.parentElement.remove()">Класс! 🎉</button>
  `;
  document.body.appendChild(t);
  confetti(['#ffd166','#ff9a6a','#ffb0c8','#c2b1ed']);
  setTimeout(() => t.remove(), 7000);
}
function showBonus(text){
  const prev = document.querySelector('.bonus-pop'); if (prev) prev.remove();
  const el = document.createElement('div');
  el.className = 'bonus-pop';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function showTipReveal(tip, isJustView){
  const prev = document.querySelector('.reveal-bg'); if (prev) prev.remove();
  const wrap = document.createElement('div');
  wrap.className = 'reveal-bg';
  const sparks = [];
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    const dist = 100 + Math.random() * 40;
    sparks.push(`<span style="top:50%;left:50%;--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;animation-delay:${i*.05}s">✨</span>`);
  }
  wrap.innerHTML = `
    <div class="reveal-card ${tip.rarity}">
      <div class="reveal-sparks">${sparks.join('')}</div>
      <div class="icn">${tip.icon}</div>
      <div class="rarity-tag">${rarityLabel(tip.rarity)}${isJustView?'':' · НОВАЯ!'}</div>
      <h3>${tip.title}</h3>
      <div class="body">${tip.body}</div>
      <button class="close-btn" onclick="document.querySelector('.reveal-bg').remove()">${isJustView?'Понятно':'Здорово! 🌟'}</button>
    </div>
  `;
  wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
}

/* ===================== BOOT ===================== */
checkDailyBonus();
render();
// Ask name gently on first open
if (!state.name && state.logs.length === 0) {
  setTimeout(() => SONO.openSettings(), 600);
}

})();
</script>
